name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ai-chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/ai-chat_test
      # Placeholders so Varlock validates during the web app's typecheck build.
      DATABASE_URL: postgresql://postgres:password@localhost:5432/ai-chat
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ci-better-auth-secret-not-for-production
      KEY_ENCRYPTION_SECRET: ci-key-encryption-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec oxlint && pnpm exec oxfmt --check

      - name: Typecheck
        run: pnpm check-types

      - name: Test
        run: pnpm test
